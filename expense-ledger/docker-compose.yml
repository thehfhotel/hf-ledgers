services:
  app:
    image: ghcr.io/thehfhotel/expense-ledger:${IMAGE_TAG:-latest}
    container_name: expense-ledger
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4050}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ:-Asia/Bangkok}
      - ENGINE_URL=${ENGINE_URL:-http://expense-ledger-engine:8080}
      - ENGINE_API_TOKEN=${ENGINE_API_TOKEN:-}
      - ACCESS_TEAM_DOMAIN=${ACCESS_TEAM_DOMAIN:-laikaexpress.cloudflareaccess.com}
      - ACCESS_AUD=${ACCESS_AUD:-}
      # AP register ("ค้างจ่าย") sqlite path — the ONE documented exception
      # to "this repo's server never talks to a database of its own" (see
      # CLAUDE.md). Lazy-opened on first /api/ap request; GET /healthz and
      # boot never touch it. Backed by the expense_ap volume below, mounted
      # at this same path, NOT the engine's expense_data volume.
      - AP_DB_PATH=${AP_DB_PATH:-/app/data/ap.db}
    volumes:
      - expense_ap:/app/data
    depends_on:
      - engine
    networks:
      - default
      - shared-nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
        reservations:
          memory: 64M

  # One-shot init: the upstream entrypoint (docker/docker-entrypoint.sh in
  # thehfhotel/ezbookkeeping @ v1.6.1) execs the server directly with no
  # mkdir step — its Dockerfile only pre-creates the *default*
  # /ezbookkeeping/storage at build time. Since EBK_STORAGE_LOCAL_FILESYSTEM_PATH
  # below redirects storage to /ezbookkeeping/data/storage (inside the
  # volume, so receipt photos persist), a fresh expense_data volume has no
  # `storage` subdir and the engine refuses to boot: "cannot load
  # configuration, because invalid local file system storage path". This
  # runs once per deploy (idempotent mkdir -p) to guarantee the directory
  # exists before the engine starts. Uses the SAME pinned engine image
  # (not a generic shell image) so its entrypoint/USER behavior is exactly
  # what we've already verified via `docker inspect` on the host, rather
  # than assumed.
  engine-init:
    image: ghcr.io/thehfhotel/ezbookkeeping@sha256:6d71a0d0f62806f609634886d0cbe9133e8177e1cb76b569d8dcc0587f734f0a
    container_name: expense-ledger-engine-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "mkdir -p /ezbookkeeping/data/storage"]
    volumes:
      - expense_data:/ezbookkeeping/data
    networks:
      - default

  engine:
    # Pinned by digest to our own GHCR mirror of upstream v1.6.1 (see
    # .github/workflows/mirror-engine.yml — `crane copy` preserves the
    # digest, so this is byte-identical to docker.io/mayswind/ezbookkeeping
    # at that tag). thehfhotel/ezbookkeeping (the source fork with
    # Dependabot alerts) is insurance only — we consume the image, never
    # build from the fork, unless upstream disappears. See README "Upgrade
    # procedure" before bumping this digest.
    image: ghcr.io/thehfhotel/ezbookkeeping@sha256:6d71a0d0f62806f609634886d0cbe9133e8177e1cb76b569d8dcc0587f734f0a
    container_name: expense-ledger-engine
    restart: unless-stopped
    # Loopback ONLY — the engine must never be reachable off-host. The
    # frontend reaches it as http://expense-ledger-engine:8080 over the
    # compose `default` network; this host-port mapping exists solely for
    # local operator access (curl/ssh tunnel), never for shared-nginx or
    # Cloudflare.
    ports:
      - "127.0.0.1:4051:8080"
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - EBK_SECURITY_SECRET_KEY=${EBK_SECURITY_SECRET_KEY:-}
      # Upstream defaults security.enable_api_token to false, which rejects
      # API-type tokens outright (pkg/middlewares/authorization.go) — the
      # frontend's src/server/engine.ts sends exactly that kind of token on
      # every call, so this must be true. A literal flag, not a secret; see
      # README "First-boot procedure" for the token-minting order (secret
      # key finalized FIRST, token minted after).
      - EBK_SECURITY_ENABLE_API_TOKEN=${EBK_SECURITY_ENABLE_API_TOKEN:-true}
      - EBK_USER_ENABLE_REGISTER=${EBK_USER_ENABLE_REGISTER:-false}
      # Redirects the engine's local-filesystem picture/avatar storage
      # (default: a directory relative to /ezbookkeeping, NOT under
      # /ezbookkeeping/data) into the one mounted volume below, so receipt
      # photos survive a container recreation instead of silently living on
      # ephemeral container storage. See README "Gotchas".
      - EBK_STORAGE_LOCAL_FILESYSTEM_PATH=/ezbookkeeping/data/storage
    volumes:
      - expense_data:/ezbookkeeping/data
    depends_on:
      engine-init:
        condition: service_completed_successfully
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz.json >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 32M

volumes:
  expense_data:
    name: expense_data
  # AP register ("ค้างจ่าย") bun:sqlite store — frontend-container-only,
  # separate from expense_data (the engine's own volume). See CLAUDE.md's
  # "AP register storage exception" note and src/server/apStore.ts.
  expense_ap:
    name: expense_ap

networks:
  shared-nginx:
    external: true
    name: shared-nginx
