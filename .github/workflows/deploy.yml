name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mirrors the estate's forced-command SSH deploy pattern (room-daily-reporter,
# hf-erp-portal, payroll):
#   - Build the image on a GH-hosted ubuntu-latest runner
#   - Push to ghcr.io/thehfhotel/income-ledger
#   - Deploy to evergreen over the shared cloudflared tunnel, SSHing as the
#     unprivileged `deploy` user. authorized_keys pins this app's key to
#     /srv/run-deploy-income-ledger.sh, so the key can ONLY trigger that one
#     script — never arbitrary commands on prod.
# No self-hosted runner; CI never shares a host with production.

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.0.0

      # Gate the deploy on the same checks the CI workflow runs. Deploy only
      # `needs` its own build job, NOT the separate CI workflow — so before
      # this step existed, a red test suite did not stop a push to main from
      # reaching production (and did exactly that for four commits once).
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/thehfhotel/income-ledger
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Cache to/from the registry — single image, no scoped GHA cache.
          cache-from: type=registry,ref=ghcr.io/thehfhotel/income-ledger:buildcache
          cache-to: type=registry,ref=ghcr.io/thehfhotel/income-ledger:buildcache,mode=max

  deploy-evergreen:
    name: Deploy to evergreen
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-evergreen-income-ledger
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v5.0.0
        with:
          sparse-checkout: |
            docker-compose.yml
          sparse-checkout-cone-mode: false

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared
          sudo install -m 755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Install SSH key + known_hosts
        env:
          SSH_KEY:  ${{ secrets.EVERGREEN_INCOME_LEDGER_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.EVERGREEN_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"  > ~/.ssh/deploy_key  && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Deploy via SSH to evergreen
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          PORTAL_DIRECTORY_TOKEN: ${{ secrets.PORTAL_DIRECTORY_TOKEN }}
          ANALYTICS_TOKEN: ${{ secrets.ANALYTICS_TOKEN }}
        run: |
          set -euo pipefail
          # Runtime env shipped alongside compose; docker compose reads
          # ./.env on `up`. Written unconditionally (unlike the portal's
          # optional-feature secrets) because this app's app-side Access
          # check is defense-in-depth, not an optional feature.
          {
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
            printf 'HOST_PORT=%s\n' "4040"
            printf 'ACCESS_TEAM_DOMAIN=%s\n' "${ACCESS_TEAM_DOMAIN:-laikaexpress.cloudflareaccess.com}"
            printf 'ACCESS_AUD=%s\n' "${ACCESS_AUD:-}"
            # Manager list derived live from the HF Managers tier via the portal
            # directory (directory-client.ts). URL is server-to-server over the
            # shared-nginx docker network - not a secret; the token is.
            printf 'PORTAL_DIRECTORY_URL=%s\n' "http://hf-erp-portal:3000/portal-api/directory/managers"
            printf 'PORTAL_DIRECTORY_TOKEN=%s\n' "${PORTAL_DIRECTORY_TOKEN:-}"
            printf 'PROTECTED_MANAGER=%s\n' "winut.hf@gmail.com"
            # Daily-rollup outbox to hf-analytics (analytics-push.ts). Dormant
            # when either is empty.
            printf 'ANALYTICS_URL=%s\n' "http://hf-analytics:3000"
            printf 'ANALYTICS_TOKEN=%s\n' "${ANALYTICS_TOKEN:-}"
          } > .env
          tar -czf /tmp/deploy.tar.gz docker-compose.yml .env
          rm -f .env

          jq -n \
            --arg commit_sha         "$GITHUB_SHA" \
            --arg deploy_payload_b64 "$(base64 -w0 < /tmp/deploy.tar.gz)" \
            --arg ghcr_user          "$GHCR_USER" \
            --arg ghcr_token         "$GHCR_TOKEN" \
            '{
              commit_sha: $commit_sha,
              deploy_payload_b64: $deploy_payload_b64,
              ghcr: { user: $ghcr_user, token: $ghcr_token }
            }' \
          | ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ProxyCommand="cloudflared --edge-ip-version 4 access ssh --hostname %h" \
              deploy@evergreen.thehfhotel.org
